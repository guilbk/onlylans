<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Audio demo</title>
<style>
  body { background: #070b14; color: #e8eefc; font: 14px system-ui, sans-serif; margin: 16px; }
  button { margin: 3px; padding: 8px 12px; background: #0e1424; color: #e8eefc; border: 1px solid #335; border-radius: 8px; cursor: pointer; }
  button:hover { border-color: #5aa9ff; }
  h3 { color: #8a96b3; margin: 16px 0 4px; }
  pre { background: #0e1424; padding: 8px; max-height: 320px; overflow: auto; }
  label { display: inline-block; margin-right: 16px; }
</style></head><body>
<h2>7 ланосів: audio demo</h2>
<h3>Sounds</h3><div id="sfx"></div>
<h3>Special</h3><div id="sp"></div>
<h3>Radio</h3><div id="mus"></div><div id="stl"></div><div id="now">station: -</div>
<label>intensity <input id="int" type="range" min="0" max="1" step="0.05" value="0.2"></label>
<label>engine <input id="eng" type="range" min="0" max="1" step="0.05" value="0"></label>
<h3>Ambience</h3><div id="amb"></div>
<label>rain <input id="rain" type="range" min="0" max="1" step="0.05" value="0"></label>
<label>traffic <input id="trf" type="range" min="0" max="1" step="0.05" value="0.6"></label>
<h3>Motor</h3><div id="mot"></div>
<label>speed <input id="spd" type="range" min="0" max="1" step="0.05" value="0"></label>
<h3>Fast x3</h3><div id="fst"></div>
<h3>Scene (music + ambience + motor)</h3><div id="scn"></div>
<h3>Volume</h3>
<label>ambience <input data-v="amb" type="range" min="0" max="1" step="0.05" value="0.8"></label>
<label>master <input data-v="master" type="range" min="0" max="1" step="0.05" value="0.8"></label>
<label>music <input data-v="music" type="range" min="0" max="1" step="0.05" value="0.7"></label>
<label>sfx <input data-v="sfx" type="range" min="0" max="1" step="0.05" value="0.9"></label>
<button id="mute">mute</button>
<h3>Levels (offline render; reload the page after measuring)</h3>
<button id="lv">measure all sounds</button><pre id="out"></pre>
<div id="hud-extra"></div>
<script src="../game/src/js/00_core.js" onerror="void 0"></script>
<script src="../game/src/js/30_audio.js"></script>
<script>
(function () {
  const A = window.PG.audio, $ = (id) => document.getElementById(id);
  function btn(parent, text, fn) {
    const b = document.createElement('button'); b.textContent = text;
    b.onclick = () => { A.unlock(); fn(); }; $(parent).appendChild(b);
  }
  A.names.forEach((n) => { if (n !== 'combo' && n !== 'medal') btn('sfx', n, () => A.play(n)); });
  [1, 2, 4, 8].forEach((n) => btn('sp', 'combo n=' + n, () => A.play('combo', { n })));
  [0, 1, 2, 3, 4].forEach((level) => btn('sp', 'medal ' + level, () => A.play('medal', { level })));
  btn('sp', 'spam 12 clicks (voice limit)', () => { for (let i = 0; i < 12; i++) A.play('pickup', { delay: i * 0.02 }); });
  const now = () => { const st = A.radio.station(); $('now').textContent = 'station: ' + (st ? st.name : '-'); };
  btn('mus', 'radio on (day)', () => { A.music.start('day'); A.radio.on(1); now(); });
  btn('mus', 'radio on (night)', () => { A.music.start('night'); A.radio.on(1); now(); });
  btn('mus', 'radio off', () => A.radio.off());
  btn('mus', 'next station', () => { A.radio.next(); setTimeout(now, 100); });
  btn('mus', 'low level', () => A.radio.level(0.25));
  let simT = 0;
  btn('mus', 'simulate ride (toggle)', () => {
    if (simT) { clearInterval(simT); simT = 0; A.radio.level(0.25); return; }
    let on = true; A.music.start('day'); A.radio.level(1);
    simT = setInterval(() => { on = !on; A.radio.level(on ? 1 : 0.25); }, 8000);
  });
  A.radio.stations().forEach((st) => btn('stl', 'station: ' + st.name, () => {
    A.music.start(st.night ? 'night' : 'day'); A.radio.on(1);
    let n = 0; while (A.radio.station() && A.radio.station().id !== st.id && n++ < 6) A.radio.next();
    setTimeout(now, 100);
  }));
  btn('mus', 'stop music', () => A.music.stop());
  btn('mus', 'duck on', () => A.music.duck(true));
  btn('mus', 'duck off', () => A.music.duck(false));
  const amb = (o) => { A.ambience.set(Object.assign({ rain: +$('rain').value, traffic: +$('trf').value, speed: +$('spd').value }, o)); };
  btn('amb', 'day street', () => amb({ night: 0, hour: 12 }));
  btn('amb', 'night street', () => amb({ night: 1, hour: 23 }));
  btn('amb', 'rush hour', () => amb({ night: 0, hour: 18 }));
  btn('amb', 'stop ambience', () => A.ambience.stop());
  $('rain').oninput = (e) => { A.unlock(); amb({ rain: +e.target.value }); };
  $('trf').oninput = (e) => { A.unlock(); amb({ traffic: +e.target.value }); };
  btn('mot', 'idle (shift running)', () => { $('spd').value = 0; A.engine.set(0, { run: true }); });
  btn('mot', 'engine off', () => A.engine.set(0));
  $('spd').oninput = (e) => { A.unlock(); A.engine.set(+e.target.value, { run: true }); A.ambience.set({ speed: +e.target.value }); };
  btn('fst', 'fast x3 on', () => A.fast.set(true));
  btn('fst', 'fast x3 off', () => A.fast.set(false));
  const scene = (mood, night, rain, h) => () => {
    $('rain').value = rain; $('spd').value = 0.5; A.music.start(mood); A.music.setIntensity(0.4);
    A.engine.set(0.5, { run: true }); A.fast.set(false); amb({ night, rain, hour: h, speed: 0.5 });
  };
  btn('scn', 'Day', scene('day', 0, 0, 12));
  btn('scn', 'Night', scene('night', 1, 0, 23));
  btn('scn', 'Rain (day)', scene('day', 0, 0.8, 12));
  btn('scn', 'Rain (night)', scene('night', 1, 0.8, 23));
  btn('scn', 'stop all', () => { A.ambience.stop(); A.music.stop(); A.engine.set(0); A.fast.set(false); });
  $('int').oninput = (e) => A.music.setIntensity(+e.target.value);
  $('eng').oninput = (e) => { A.unlock(); A.engine.set(+e.target.value); };
  document.querySelectorAll('[data-v]').forEach((el) => {
    el.oninput = () => A.setVolume({ [el.dataset.v]: +el.value });
  });
  $('mute').onclick = () => { A.unlock(); A.setMuted(!A.getSettings().muted); };

  $('lv').onclick = async () => {
    const out = [], db = (x) => (20 * Math.log10(x || 1e-9)).toFixed(1);
    const live = A.getSettings();
    for (const n of A.names) {
      const oc = new OfflineAudioContext(1, 44100 * 3, 44100);
      A._attach(oc);
      A.setMuted(false);
      A.play(n, { n: 3, level: 3 });
      const buf = await oc.startRendering();
      const d = buf.getChannelData(0); let pk = 0, ss = 0;
      for (let i = 0; i < d.length; i++) { pk = Math.max(pk, Math.abs(d[i])); ss += d[i] * d[i]; }
      out.push(n.padEnd(14) + 'peak ' + db(pk).padStart(6) + '   rms(active) ' + db(Math.sqrt(ss / d.length)));
    }
    for (const sc of [['amb day', 0, 0], ['amb night', 1, 0], ['amb rain', 0, 0.9]]) {
      const oc = new OfflineAudioContext(1, 44100 * 12, 44100);
      A._attach(oc); A.setMuted(false);
      A.ambience.set({ night: sc[1], rain: sc[2], traffic: 0.8, speed: 0.6, hour: 18 });
      A.ambience._tick(11);
      const d = (await oc.startRendering()).getChannelData(0); let pk = 0, ss = 0;
      for (let i = 44100 * 2; i < d.length; i++) { pk = Math.max(pk, Math.abs(d[i])); ss += d[i] * d[i]; }
      out.push(sc[0].padEnd(14) + 'peak ' + db(pk).padStart(6) + '   rms ' + db(Math.sqrt(ss / (d.length - 88200))));
    }
    $('out').textContent = out.join('\n');
    A.setMuted(live.muted);
  };
  A.init();
})();
</script></body></html>
